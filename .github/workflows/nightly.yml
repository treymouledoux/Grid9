name: Nightly Release
 
on:
  schedule:
    - cron: '59 4 * * *'
  workflow_dispatch: # lets you trigger a nightly build manually from the Actions tab
 
permissions:
  contents: read
 
jobs:
  nightly-release:
    name: Nightly Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a failure on one OS shouldn't cancel the other's build
      matrix:
        os: [ubuntu-latest, windows-latest]
 
    steps:
      - name: Checkout Grid9
        uses: actions/checkout@v6
 
      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable' # tracks Nim's current stable release; pin e.g. '2.2.x' instead if you'd rather control upgrades yourself
          repo-token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Cache nimble packages
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('**/*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-
 
      - name: Install dependencies
        run: |
          nimble install docopt -y
          nimble install parsetoml -y
 
      - name: Build
        run: nim c -d:release src/main
 
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Grid9_Nightly_${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'src/main.exe' || 'src/main' }}
          if-no-files-found: error
          retention-days: 14
 